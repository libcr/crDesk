<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>crDesk</title><link rel="stylesheet" href="/auth/style.css"><script src="/auth/app.js" defer></script></head>
<body><main><h1>crDesk</h1><p id="intro"></p><p id="device"></p><p id="status" role="status" aria-live="polite"></p>
<section id="login" hidden><button id="google"></button><button id="passkey"></button><button id="phoneAction"></button><p id="phone"></p><button id="registerPhone"></button><p id="registerHint"></p></section>
<button id="restart" hidden></button><p id="nativeRestartHint" class="next-step" role="status" hidden></p>
<section id="account" hidden><p id="identity"></p><section id="nextStep" class="next-step" aria-labelledby="nextStepTitle" hidden><h2 id="nextStepTitle"></h2><p id="nextStepText" role="status" aria-live="polite"></p>
<div id="approval"><button id="approve"></button><p id="warning"></p></div></section>
<p id="loginMethod"></p><p id="loginMethods"></p><button id="logout"></button><button id="add"></button><button id="addPhone"></button><p id="addhint"></p>
<div class="section-header"><h2 id="devicesTitle"></h2><button id="refresh"></button></div><div class="device-filters"><input id="deviceSearch" type="search"><select id="groupFilter"></select></div><ul id="devices"></ul><h2 id="keysTitle"></h2><ul id="keys"></ul>
<details id="serverPanel"><summary id="serverTitle"></summary><p id="serverHint"></p><dl id="serverStatus"></dl><h3 id="diagnosticsTitle"></h3><p id="diagnosticsHint"></p><ul id="diagnostics"></ul></details>
<details id="historyPanel"><summary id="historyTitle"></summary><p id="historyHint"></p><ul id="history"></ul></details>
</section>
<dialog id="metadataDialog"><form id="metadataForm"><h2 id="metadataTitle"></h2>
<label id="nameLabel" for="metadataName"></label><input id="metadataName" maxlength="64" required>
<label id="groupLabel" for="metadataGroup"></label><input id="metadataGroup" maxlength="64" list="knownGroups"><datalist id="knownGroups"></datalist>
<label id="tagsLabel" for="metadataTags"></label><input id="metadataTags" maxlength="264">
<label id="noteLabel" for="metadataNote"></label><input id="metadataNote" maxlength="256">
<label id="orderLabel" for="metadataOrder"></label><input id="metadataOrder" type="number" min="0" max="9999" required>
<p id="metadataHint"></p><p id="metadataError" role="alert"></p><div class="row-actions"><button id="metadataCancel" type="button"></button><button id="metadataSave" type="submit"></button></div>
</form></dialog>
</main></body></html>
